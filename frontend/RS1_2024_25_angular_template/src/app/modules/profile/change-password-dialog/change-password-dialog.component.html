<h2 mat-dialog-title>Change Password</h2>

<form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <!-- Current Password -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <input matInput [type]="hideCurrentPassword ? 'password' : 'text'"
             formControlName="currentPassword">
      <button mat-icon-button matSuffix type="button"
              (click)="hideCurrentPassword = !hideCurrentPassword">
        <mat-icon>{{hideCurrentPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error>{{getErrorMessage('currentPassword')}}</mat-error>
    </mat-form-field>

    <!-- New Password -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input matInput [type]="hideNewPassword ? 'password' : 'text'"
             formControlName="newPassword">
      <button mat-icon-button matSuffix type="button"
              (click)="hideNewPassword = !hideNewPassword">
        <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error>{{getErrorMessage('newPassword')}}</mat-error>
    </mat-form-field>

    <!-- Password Requirements -->
    <div class="password-requirements"
         *ngIf="passwordForm.get('newPassword')?.value">
      <mat-progress-bar mode="determinate"
                        [value]="getPasswordStrength(passwordForm.get('newPassword')?.value)">
      </mat-progress-bar>
      <div class="requirements-list">
        <div *ngFor="let req of passwordPattern.requirements"
             [class.met]="req.regex.test(passwordForm.get('newPassword')?.value)">
          <mat-icon>{{req.regex.test(passwordForm.get('newPassword')?.value) ?
            'check_circle' : 'cancel'}}</mat-icon>
          {{req.text}}
        </div>
      </div>
    </div>

    <!-- Confirm Password -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <input matInput [type]="hideConfirmPassword ? 'password' : 'text'"
             formControlName="confirmPassword">
      <button mat-icon-button matSuffix type="button"
              (click)="hideConfirmPassword = !hideConfirmPassword">
        <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error>{{getErrorMessage('confirmPassword')}}</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false"
            [disabled]="loading">Cancel</button>
    <button mat-raised-button color="primary" type="submit"
            [disabled]="passwordForm.invalid || loading">
      <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
      <span *ngIf="!loading">Change Password</span>
    </button>
  </mat-dialog-actions>
</form>
