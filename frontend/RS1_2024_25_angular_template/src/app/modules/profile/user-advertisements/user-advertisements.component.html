<div class="advertisements-container">
  <mat-tab-group (selectedTabChange)="onTabChange($event)">
    <mat-tab label="Active">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-advertisement-grid
            [advertisements]="advertisements"
            [loading]="loading"
            [showActions]="showExpired"
            (actionTriggered)="onActionTriggered($event)">
          </app-advertisement-grid>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Sold">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-advertisement-grid
            [advertisements]="advertisements"
            [loading]="loading"
            [showActions]="showExpired">
          </app-advertisement-grid>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Expired" *ngIf="showExpired">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-advertisement-grid
            [advertisements]="advertisements"
            [loading]="loading"
            [showActions]="showExpired">
          </app-advertisement-grid>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
