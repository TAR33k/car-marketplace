<div class="advertisement-grid">
  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <div class="no-items" *ngIf="!loading && advertisements.length === 0">
    <mat-icon>inventory_2</mat-icon>
    <p>No advertisements found</p>
  </div>

  <div class="grid-container" *ngIf="!loading && advertisements.length > 0">
    <mat-card *ngFor="let ad of advertisements"
              class="ad-card"
              [class.clickable]="true"
              (click)="onCardClick(ad.id, $event)">
      <div class="image-container">
        <img [src]="ad.primaryImageUrl" [alt]="ad.title">
        <div class="condition-badge" [ngClass]="'condition-' + ad.condition">
          {{getConditionLabel(ad.condition)}}
        </div>
      </div>

      <mat-card-content>
        <h3>{{ ad.title }}</h3>
        <p class="price">{{ad.price | currency:'EUR':'symbol':'1.0-0'}}</p>
        <p class="details">{{ ad.carName }}</p>
        <p class="meta">
          <span>
            <mat-icon>visibility</mat-icon>
            {{ ad.viewCount }} views
          </span>
          <span>
            <mat-icon>calendar_today</mat-icon>
            {{ ad.listingDate | date }}
          </span>
        </p>
      </mat-card-content>

      <mat-card-actions *ngIf="showActions" class="action-buttons">
        <button mat-button color="primary" (click)="onAction($event, 'edit', ad.id)">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button mat-button color="warn" (click)="onAction($event, 'delete', ad.id)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
